<!-- Buscá la parte de la lista (ul) en el HTML y verás que agregué una línea para los estantes -->
<div class="print-only col-span-2 space-y-4 text-slate-800">
    <h3 class="text-lg font-black uppercase underline">Detalle del Presupuesto:</h3>
    <ul class="text-sm space-y-2 font-medium">
        <li>📦 Cantidad: <span id="printCant" class="font-bold"></span> mueble(s) completo(s).</li>
        <li>✅ Estructura de Pino seleccionado (Cepillado).</li>
        <li>✅ Estantes de Fenólico de 18mm de espesor.</li>
        <li>📋 Configuración: <span id="printEstantes" class="font-bold"></span> estantes por unidad.</li>
        <li>✅ Sistema reforzado con <span id="printPatas" class="font-bold"></span> patas de apoyo por mueble.</li>
        <li>📏 Medidas unitarias: <span id="printMedidas" class="font-bold"></span></li>
    </ul>
</div>

<script>
    const ids = ['precioPlaca', 'precioPino', 'multiplicador', 'alto', 'ancho', 'prof', 'estantes', 'cantMuebles'];
    
    function redondearDecena(numero) {
        return Math.ceil(numero / 10) * 10;
    }

    function calcular() {
        const val = (id) => parseFloat(document.getElementById(id).value) || 0;
        const pPlaca = val('precioPlaca');
        const pPino = val('precioPino');
        const mult = val('multiplicador');
        const alto = val('alto'), ancho = val('ancho'), prof = val('prof'), cantEstantes = val('estantes');
        const cantMuebles = val('cantMuebles') || 1;

        document.getElementById('fechaActual').innerText = "Totoras, " + new Date().toLocaleDateString('es-AR');

        let marcos = ancho > 180 ? 4 : (ancho > 110 ? 3 : 2);
        const patas = marcos * 2;
        
        const metrosPino = ((alto * patas) + (prof * patas * cantEstantes) + (ancho * 2 * cantEstantes)) / 100;
        const costoPino = (metrosPino * 1.15) * pPino;
        const m2Placa = (ancho * prof * cantEstantes) / 10000;
        const costoFen = (m2Placa * 1.15 / (2.44 * 1.22)) * pPlaca;

        const totalMatUnitario = costoPino + costoFen + 5000;
        const totalMatGeneral = totalMatUnitario * cantMuebles;
        let ventaFinal = redondearDecena(totalMatGeneral * mult);

        document.getElementById('precioFinal').innerText = "$ " + ventaFinal.toLocaleString('es-AR');
        document.getElementById('resCostoMat').innerText = "$ " + Math.round(totalMatGeneral).toLocaleString('es-AR');
        document.getElementById('resManoObra').innerText = "$ " + Math.round(ventaFinal - totalMatGeneral).toLocaleString('es-AR');
        
        // --- AQUÍ SE AGREGAN LOS DATOS PARA EL CLIENTE ---
        document.getElementById('printMedidas').innerText = `${alto}x${ancho}x${prof} cm`;
        document.getElementById('printPatas').innerText = patas;
        document.getElementById('printCant').innerText = cantMuebles;
        document.getElementById('printEstantes').innerText = cantEstantes; // <--- NUEVA LÍNEA
    }

    function enviarWhatsApp() {
        const total = document.getElementById('precioFinal').innerText;
        const medidas = document.getElementById('printMedidas').innerText;
        const cant = document.getElementById('cantMuebles').value;
        const estantes = document.getElementById('estantes').value; // <--- NUEVO
        
        const mensaje = encodeURIComponent(
            `*Presupuesto - Artesanías La Villa*\n\n` +
            `*Producto:* Estantería Sistema Reforzado\n` +
            `*Cantidad:* ${cant} unidad(es)\n` +
            `*Medidas:* ${medidas}\n` +
            `*Distribución:* ${estantes} estantes por mueble\n` + // <--- NUEVO
            `*Total:* ${total}\n\n` +
            `_📍 Totoras, Santa Fe_`
        );
        
        window.open(`https://wa.me/?text=${mensaje}`, '_blank');
    }

    ids.forEach(id => document.getElementById(id).addEventListener('input', calcular));
    calcular();
</script>
