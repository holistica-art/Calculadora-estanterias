<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cortes - ALMA PLENA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background-color: #f0f2f5; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a1a1a; text-align: center; border-bottom: 3px solid #f39c12; padding-bottom: 10px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; font-size: 0.9em; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        input:focus { border-color: #f39c12; outline: none; background-color: #fffdf9; }
        .flex-row { display: flex; gap: 10px; }
        .section-title { margin-top: 20px; color: #f39c12; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        /* Caja de resultados */
        .result-box { margin-top: 25px; padding: 20px; background: #2c3e50; color: white; border-radius: 8px; }
        .result-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1em; opacity: 0.9; }
        .total-highlight { font-size: 1.6em; color: #f39c12; font-weight: bold; border-top: 1px solid #555; margin-top: 10px; padding-top: 10px;}
        
        /* Botones */
        .btn-container { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-ws { background-color: #25d366; color: white; }
        .btn-ws:hover { background-color: #128c7e; }
        .btn-print { background-color: #3498db; color: white; }
        
        /* Ocultar elementos en impresión */
        @media print {
            .no-print, .section-title, label, input, .btn-container, .ganancia-info { display: none !important; }
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; max-width: 100%; }
            .result-box { background: white; color: black; padding: 0; }
            .total-highlight { color: black; border-top: 2px solid black; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="print-header">
        <h2 style="border:none">Presupuesto de Corte</h2>
        <p>Carpintería Artesanal</p>
    </div>

    <h2 class="no-print">Presupuesto de Taller</h2>
    
    <div class="no-print">
        <label>Precio Placa Entera ($):</label>
        <input type="number" id="precioPlaca" placeholder="Ej: 60000" oninput="calcular()">

        <div class="flex-row">
            <div style="flex:1">
                <label>Largo Placa (cm):</label>
                <input type="number" id="largoP" value="260" oninput="calcular()">
            </div>
            <div style="flex:1">
                <label>Ancho Placa (cm):</label>
                <input type="number" id="anchoP" value="183" oninput="calcular()">
            </div>
        </div>
    </div>

    <div class="section-title">Detalle del Trabajo</div>

    <div class="flex-row">
        <div style="flex:1.5">
            <label>Medidas Corte (cm):</label>
            <div class="flex-row">
                <input type="number" id="largoC" placeholder="Largo" oninput="calcular()">
                <input type="number" id="anchoC" placeholder="Ancho" oninput="calcular()">
            </div>
        </div>
        <div style="flex:0.5">
            <label>Cant.:</label>
            <input type="number" id="unidades" value="1" min="1" oninput="calcular()">
        </div>
    </div>

    <div class="flex-row no-print">
        <div style="flex:1">
            <label>Precio c/ Tirada ($):</label>
            <input type="number" id="precioTirada" placeholder="Ej: 500" oninput="calcular()">
        </div>
        <div style="flex:1">
            <label>Cant. Tiradas:</label>
            <input type="number" id="cantTiradas" placeholder="1 o 2" oninput="calcular()">
        </div>
    </div>

    <div class="no-print">
        <label>Multiplicador Final (Ganancia):</label>
        <input type="number" id="multi" value="2" step="0.1" oninput="calcular()">
    </div>

    <div class="result-box">
        <div id="detalleCliente" style="margin-bottom: 15px; font-size: 0.9em; line-height: 1.4;">
            <!-- Aquí se mostrará el resumen para el cliente -->
        </div>
        
        <div class="result-line ganancia-info">
            <span>Solo Material:</span>
            <span id="soloMaterial">$0</span>
        </div>
        <div class="result-line ganancia-info">
            <span>Total Cortes:</span>
            <span id="soloCortes">$0</span>
        </div>
        <div class="result-line total-highlight">
            <span>TOTAL:</span>
            <span id="precioVenta">$0</span>
        </div>
    </div>

    <div class="btn-container no-print">
        <button class="btn-ws" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
        <button class="btn-print" onclick="window.print()">Imprimir Presupuesto</button>
    </div>
</div>

<script>
function redondearDecena(numero) {
    return Math.ceil(numero / 10) * 10;
}

function calcular() {
    const pPlaca = parseFloat(document.getElementById('precioPlaca').value) || 0;
    const lP = parseFloat(document.getElementById('largoP').value) || 0;
    const aP = parseFloat(document.getElementById('anchoP').value) || 0;
    
    const lC = parseFloat(document.getElementById('largoC').value) || 0;
    const aC = parseFloat(document.getElementById('anchoC').value) || 0;
    const unidades = parseInt(document.getElementById('unidades').value) || 1;
    
    const pTirada = parseFloat(document.getElementById('precioTirada').value) || 0;
    const cTiradas = parseFloat(document.getElementById('cantTiradas').value) || 0;
    
    const multi = parseFloat(document.getElementById('multi').value) || 1;

    if (pPlaca && lP && aP && lC && aC) {
        const m2Placa = (lP * aP) / 10000;
        const m2Corte = (lC * aC) / 10000;
        
        // Costo de material x cantidad de piezas
        const costoMaterialPuro = ((pPlaca / m2Placa) * m2Corte) * unidades;
        const costoTotalCortes = pTirada * cTiradas;
        
        // Venta final con multiplicador y REDONDEO
        let ventaFinal = (costoMaterialPuro + costoTotalCortes) * multi;
        ventaFinal = redondearDecena(ventaFinal);

        // Mostrar resultados
        document.getElementById('soloMaterial').innerText = "$" + Math.round(costoMaterialPuro).toLocaleString('es-AR');
        document.getElementById('soloCortes').innerText = "$" + Math.round(costoTotalCortes).toLocaleString('es-AR');
        document.getElementById('precioVenta').innerText = "$" + ventaFinal.toLocaleString('es-AR');
        
        // Actualizar detalle para el cliente
        document.getElementById('detalleCliente').innerHTML = `
            <strong>Detalle:</strong> ${unidades} pieza(s) de ${lC}x${aC} cm.
        `;
    }
}

function enviarWhatsApp() {
    const total = document.getElementById('precioVenta').innerText;
    const lC = document.getElementById('largoC').value;
    const aC = document.getElementById('anchoC').value;
    const cant = document.getElementById('unidades').value;
    
    const mensaje = encodeURIComponent(
        `*Presupuesto de Carpintería*\n\n` +
        `*Detalle:* ${cant} pieza(s) de ${lC}x${aC} cm\n` +
        `*Total:* ${total}\n\n` +
        `_Precios sujetos a cambios sin previo aviso._`
    );
    
    window.open(`https://wa.me/?text=${mensaje}`, '_blank');
}
</script>

</body>
</html>
