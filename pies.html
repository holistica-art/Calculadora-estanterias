<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pies y Presupuesto</title>
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 10px; 
        }
        label { 
            display: block; 
            margin-top: 10px; 
            color: #aaa; 
            font-size: 0.9rem; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border-radius: 5px; 
            border: none; 
            font-size: 1rem; 
            background: #2c2c2c;
            color: white;
        }
        
        .pantalla-pies { 
            background: #333; 
            text-align: center; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 20px 0; 
            border: 2px solid #ffb74d;
        }
        .valor-grande { font-size: 2.2rem; color: #ffb74d; font-weight: bold; }
        .etiqueta { font-size: 0.9rem; color: #aaa; }
        
        .total-costo { 
            font-size: 1.4rem; 
            color: #81c784; 
            text-align: center; 
            margin: 15px 0;
            font-weight: bold;
        }

        .btn-accion {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-wsp { background-color: #25d366; color: white; }
        .btn-print { background-color: #4a90e2; color: white; }

        /* Estilo especial para cuando se imprime o se exporta a PDF */
        @media print {
            body { background-color: white; color: black; }
            .container { background: white; box-shadow: none; max-width: 100%; }
            input, .ocultar-impresion, .btn-accion { display: none !important; }
            .pantalla-pies { border: 2px solid #000; background: #f0f0f0; }
            .valor-grande { color: #000; }
            .total-costo { color: #000; }
            label { color: #333; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Madera</h2>
    
    <label>Largo (metros)</label>
    <input type="number" id="largo" step="0.01" placeholder="Ej: 2.20" oninput="calcular()">
    
    <label>Ancho (centímetros)</label>
    <input type="number" id="ancho" step="0.1" placeholder="Ej: 25" oninput="calcular()">
    
    <label>Espesor (pulgadas)</label>
    <input type="number" id="espesor" step="0.25" value="1" oninput="calcular()">
    
    <!-- Sección principal de Pies -->
    <div class="pantalla-pies">
        <div class="etiqueta">CANTIDAD DE PIES</div>
        <div id="resPies" class="valor-grande">0.00</div>
    </div>
    
    <!-- Este casillero se oculta al imprimir para que no salga el precio por pie -->
    <div class="ocultar-impresion">
        <label>Precio por Pie ($)</label>
        <input type="number" id="precio" step="0.01" placeholder="Ej: 1500" oninput="calcular()">
    </div>
    
    <div class="total-costo">
        Total: <span id="resCosto">$0.00</span>
    </div>

    <!-- Botones nuevos -->
    <button class="btn-accion btn-wsp" onclick="enviarWhatsApp()">Enviar por WhatsApp 📱</button>
    <button class="btn-accion btn-print" onclick="window.print()">Imprimir / Guardar PDF 🖨️</button>
</div>

<script>
    function calcular() {
        let largoM = parseFloat(document.getElementById('largo').value) || 0;
        let anchoCm = parseFloat(document.getElementById('ancho').value) || 0;
        let espesorPul = parseFloat(document.getElementById('espesor').value) || 0;
        let precioPt = parseFloat(document.getElementById('precio').value) || 0;

        let volumenCm3 = (largoM * 100) * anchoCm * (espesorPul * 2.54);
        let piesTabla = volumenCm3 / 2360;

        document.getElementById('resPies').innerText = piesTabla.toFixed(2);
        document.getElementById('resCosto').innerText = "$" + (piesTabla * precioPt).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function enviarWhatsApp() {
        let largo = document.getElementById('largo').value || 0;
        let ancho = document.getElementById('ancho').value || 0;
        let espesor = document.getElementById('espesor').value || 1;
        let pies = document.getElementById('resPies').innerText;
        let costo = document.getElementById('resCosto').innerText;

        let texto = `Hola! Te paso el detalle de la madera:\n` +
                    `- Medidas: ${largo}m x ${ancho}cm x ${espesor}"\n` +
                    `- Cantidad: ${pies} pies de tabla\n` +
                    `- Costo Total: ${costo}`;

        let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
